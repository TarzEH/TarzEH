<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f1320"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#2dd4bf">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
  </g>

  <!-- Network nodes (left) -->
  <g opacity="0.10">
    <circle cx="80" cy="60" r="16" fill="none" stroke="#2dd4bf" stroke-width="1.2"/>
    <circle cx="80" cy="60" r="4" fill="#2dd4bf"/>
    <circle cx="30" cy="140" r="12" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="30" cy="140" r="3" fill="#2dd4bf"/>
    <circle cx="140" cy="160" r="10" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="140" cy="160" r="3" fill="#22d3ee"/>
    <circle cx="60" cy="230" r="8" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="60" cy="230" r="2.5" fill="#2dd4bf"/>
    <line x1="80" y1="60" x2="30" y2="140" stroke="#2dd4bf" stroke-width="0.8"/>
    <line x1="80" y1="60" x2="140" y2="160" stroke="#22d3ee" stroke-width="0.6"/>
    <line x1="30" y1="140" x2="60" y2="230" stroke="#2dd4bf" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="30" y1="140" x2="140" y2="160" stroke="#2dd4bf" stroke-width="0.5" stroke-dasharray="4"/>
  </g>

  <!-- Network nodes (right) -->
  <g opacity="0.10">
    <circle cx="1120" cy="70" r="14" fill="none" stroke="#2dd4bf" stroke-width="1.2"/>
    <circle cx="1120" cy="70" r="4" fill="#2dd4bf"/>
    <circle cx="1170" cy="150" r="10" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="1170" cy="150" r="3" fill="#22d3ee"/>
    <circle cx="1060" cy="180" r="12" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="1060" cy="180" r="3" fill="#2dd4bf"/>
    <circle cx="1140" cy="240" r="8" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="1140" cy="240" r="2.5" fill="#2dd4bf"/>
    <line x1="1120" y1="70" x2="1170" y2="150" stroke="#22d3ee" stroke-width="0.8"/>
    <line x1="1120" y1="70" x2="1060" y2="180" stroke="#2dd4bf" stroke-width="0.6"/>
    <line x1="1170" y1="150" x2="1140" y2="240" stroke="#2dd4bf" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="1060" y1="180" x2="1140" y2="240" stroke="#2dd4bf" stroke-width="0.5" stroke-dasharray="4"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Terminal prompt decoration -->
  <g transform="translate(380, 100)" opacity="0.08" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#2dd4bf">
    <text x="0" y="0">$ whoami</text>
    <text x="0" y="22">security_researcher</text>
    <text x="0" y="52">$ cat /etc/motd</text>
    <text x="0" y="74">build. break. secure.</text>
  </g>

  <!-- Name -->
  <text x="600" y="140" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" letter-spacing="-0.5" filter="url(#glow)">TarzEH</text>

  <!-- Role -->
  <text x="600" y="180" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="4">SECURITY RESEARCHER</text>

  <!-- Accent line under role -->
  <rect x="530" y="195" width="140" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Minimal tagline -->
  <text x="600" y="235" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#475569" letter-spacing="1">build. break. secure.</text>

  <!-- Accent line bottom -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
